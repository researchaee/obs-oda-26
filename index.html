<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<base href="observatorio-maizoryza/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Observatório de Preços do Arroz</title>
<meta name="description" content="Produção, comércio, consumo e cotações do arroz; painel comparativo de outras culturas.">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="./assets/index-mz4872313b.css">
<style>
body{margin:0;background:#faf9f5;color:#141413}
.mz-variety-table{width:100%;border-collapse:collapse;font-size:.9rem}
.mz-variety-table th,.mz-variety-table td{padding:.55rem .7rem;border-bottom:1px solid #dfe3d8;text-align:right;white-space:nowrap}
.mz-variety-table th:first-child,.mz-variety-table td:first-child{text-align:left}
.mz-variety-table th{position:sticky;top:0;background:#f4f5ef;color:#1e2923;z-index:1}
.mz-variety-table td.num{font-variant-numeric:tabular-nums}
.mz-variety-table-wrap{max-height:560px;overflow:auto;margin-top:.75rem;border:1px solid #dde1d3;border-radius:8px}
.axis{fill:#46534a;font-size:13px}
.series-end-label,.series-end-leader{display:none}
.chart-legend{max-width:100%;color:#26352c;font-size:15px;line-height:1.55;gap:12px 20px}
.chart-legend>span{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:left}
.symbol-legend{flex-wrap:wrap;justify-content:flex-start;color:#26352c;line-height:1.55}
.assistant-jump,.home-assistant,
[class*="assistant" i],[id*="assistant" i],
[aria-label*="assistente" i],[aria-label*="assistant" i],
[class*="chatbot" i],[id*="chatbot" i],
[class*="ai-chat" i],[id*="ai-chat" i]{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./assets/index-mz1d1d52bf.js"></script>
<script>
(() => {
  const hideAssistant = () => {
    document.querySelectorAll("#assistant, .chat-panel, .home-assistant, .assistant-jump")
      .forEach(element => {
        element.hidden = true;
        element.style.setProperty("display", "none", "important");
      });
  };
  const fixYearColon = () => {
    document.querySelectorAll("article small").forEach(el => {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        const fixed = node.nodeValue.replace(/(\b2025|\bEurostat)\s+[—–-]\s+/, "$1: ");
        if (fixed !== node.nodeValue) node.nodeValue = fixed;
      }
    });
  };
  const hideAxisLegend = () => {
    document.querySelectorAll("#production-area-yield span").forEach(el => {
      if (el.style.display !== "none" && /^Eixo (horizontal|vertical):/.test(el.textContent.trim())) {
        el.style.setProperty("display", "none", "important");
      }
    });
  };
  const fixEvolutionRef = () => {
    document.querySelectorAll("#production-area-yield small").forEach(el => {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue.includes("na evolução")) {
          node.nodeValue = node.nodeValue.replace("na evolução", "no gráfico de evolução (nº1)");
        }
      }
    });
  };
  const fixRankingRef = () => {
    document.querySelectorAll("#production-ranking small").forEach(el => {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        const fixed = node.nodeValue.replace(/(evolução)(?!\s*\(nº)/, "$1 (nº1)");
        if (fixed !== node.nodeValue) node.nodeValue = fixed;
      }
    });
  };
  const VARIETIES_NOTE = "Portugal: área declarada ao IFAP. Itália: área semeada declarada ao Ente Nazionale Risi (Database Superfici), por variedade e grupo varietal. Espanha: apenas a província de Sevilha, com a percentagem da área semeada das principais variedades publicada pela RAIF (Junta de Andalucía) no boletim final da campanha (2022, 2024 e 2025).";
  const fixVarietiesNote = () => {
    const p = document.querySelector("#production-varieties > p");
    if (p && p.textContent.trim().startsWith("Área declarada no IFAP")) p.textContent = VARIETIES_NOTE;
  };
  const tidy = () => { hideAssistant(); fixYearColon(); hideAxisLegend(); fixEvolutionRef(); fixRankingRef(); fixVarietiesNote(); };
  tidy();
  new MutationObserver(tidy).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>
</body>
</html>
